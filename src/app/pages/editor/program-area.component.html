<section class="flex h-full flex-col gap-3" aria-label="Program">
	<div class="flex items-center justify-between gap-2">
		<h2 class="text-[0.7rem] font-bold tracking-[0.08em] text-slate-400 uppercase">Program</h2>
		<button type="button" class="cursor-pointer rounded-full border border-slate-400/25 px-3 py-1.5 text-[0.7rem] font-semibold text-slate-300 uppercase hover:bg-slate-400/10 disabled:cursor-default disabled:opacity-40" [disabled]="!program()" (click)="copy()">{{ copied() ? 'Copied' : 'Copy' }}</button>
	</div>

	@if (program()) {
		<textarea
			class="min-h-0 flex-1 resize-none rounded-[0.9rem] border border-slate-400/20 bg-slate-900/90 p-3 font-mono text-[0.7rem] leading-relaxed text-slate-200 outline-none"
			spellcheck="false"
			readonly
			aria-label="Program as JSON, made from the blocks"
			[value]="source()"
		></textarea>
	} @else {
		<p class="rounded-[0.9rem] border border-slate-400/20 bg-slate-900/60 px-4 py-6 text-center text-[0.76rem] text-slate-400">There is no program yet. Add blocks, and finish the ones marked in red, in the Blocks tab.</p>
	}

	<p class="text-[0.7rem] text-slate-400">Read only. It is made from the blocks: change them to change the program.</p>
</section>
