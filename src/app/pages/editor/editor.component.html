<div class="relative block h-screen w-screen overflow-hidden bg-(image:--editor-gradient) font-[Inter,'Segoe_UI',sans-serif] text-slate-100">
	<app-cube #cube class="absolute inset-y-0 right-0 left-0 lg:left-[26rem]" [environment]="environment()" aria-label="Virtual LED cube preview" />

	<nav class="absolute top-4 left-4 z-20 flex gap-2 rounded-full border border-slate-400/20 bg-(--surface) p-[0.4rem] shadow-[0_10px_30px_var(--shadow)] backdrop-blur-[6px]" aria-label="Navegación principal">
		<a routerLink="/login" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-(--nav-text) uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Login</a>
		<a routerLink="/register" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-(--nav-text) uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Register</a>
		<a routerLink="/test-cube" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-(--nav-text) uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Cube</a>
		<a routerLink="/editor" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-(--nav-text) uppercase no-underline transition duration-150 bg-slate-400/15 opacity-100 shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Editor</a>
	</nav>

	<div class="absolute top-1/2 right-4 z-10 flex -translate-y-1/2 flex-col gap-2 rounded-[22px] border border-slate-400/20 bg-(--surface) p-2 shadow-[0_20px_50px_var(--shadow)] backdrop-blur-[10px]" role="group" aria-label="Camera view">
		<button
			type="button"
			class="cursor-pointer rounded-full border px-4 py-2 text-[0.76rem] font-semibold tracking-[0.04em] uppercase transition duration-150"
			[class]="cube.camera() === 'spin' ? 'border-slate-300/40 bg-slate-400/20 text-slate-50' : 'border-transparent text-slate-300 hover:bg-slate-400/10'"
			(click)="cube.spin()"
		>Spin</button>
		@for (face of faces; track face.value) {
			<button
				type="button"
				class="cursor-pointer rounded-full border px-4 py-2 text-[0.76rem] font-semibold tracking-[0.04em] uppercase transition duration-150"
				[class]="cube.camera() === face.value ? 'border-slate-300/40 bg-slate-400/20 text-slate-50' : 'border-transparent text-slate-300 hover:bg-slate-400/10'"
				(click)="cube.showFace(face.value)"
			>{{ face.label }}</button>
		}
	</div>

	<aside class="absolute top-20 bottom-4 left-4 z-10 flex w-[24rem] max-w-[calc(100vw-2rem)] flex-col gap-3 rounded-[22px] border border-slate-400/20 bg-(--surface) p-4 shadow-[0_20px_50px_var(--shadow)] backdrop-blur-[10px]">
		<div class="flex gap-2" role="tablist" aria-label="Side panel">
			@for (item of tabs; track item.id) {
				<button
					type="button"
					role="tab"
					class="cursor-pointer rounded-full border px-4 py-2 text-[0.76rem] font-semibold tracking-[0.04em] uppercase transition duration-150"
					[class]="tab() === item.id ? 'border-slate-300/40 bg-slate-400/20 text-slate-50' : 'border-transparent text-slate-300 hover:bg-slate-400/10'"
					[attr.aria-selected]="tab() === item.id"
					(click)="tab.set(item.id)"
				>{{ item.label }}</button>
			}
		</div>

		<!-- All stay alive and the others are hidden, so switching tabs loses neither the blocks, the program text nor the picture being cropped. -->
		<div class="min-h-0 flex-1" role="tabpanel" [hidden]="tab() !== 'blocks'">
			<app-blocks-tab
				class="block h-full"
				[running]="cube.running()"
				[problem]="cube.problem()"
				(run)="cube.run($event)"
				(stop)="cube.stop()"
				(reset)="cube.reset()"
			/>
		</div>

		<div class="min-h-0 flex-1" role="tabpanel" [hidden]="tab() !== 'program'">
			<app-program-area
				class="block h-full"
				[running]="cube.running()"
				[problem]="cube.problem()"
				(run)="cube.run($event)"
				(stop)="cube.stop()"
				(reset)="cube.reset()"
			/>
		</div>

		<div class="min-h-0 flex-1 overflow-y-auto" role="tabpanel" [hidden]="tab() !== 'background'">
			<app-background-panel [(environment)]="environment" />
		</div>
	</aside>
</div>
