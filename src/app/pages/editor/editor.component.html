<div class="relative block h-screen w-screen overflow-hidden bg-[radial-gradient(circle_at_70%_50%,#171b22_0%,#0d1016_45%,#07090d_100%)] font-[Inter,'Segoe_UI',sans-serif] text-slate-100">
	<app-cube #cube class="absolute inset-y-0 right-0 left-0 lg:left-[26rem]" aria-label="Virtual LED cube preview" />

	<nav class="absolute top-4 left-4 z-20 flex gap-2 rounded-full border border-slate-400/20 bg-[rgba(10,13,18,0.82)] p-[0.4rem] shadow-[0_10px_30px_rgba(0,0,0,0.25)] backdrop-blur-[6px]" aria-label="Navegación principal">
		<a routerLink="/login" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-[#dfeaf6] uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Login</a>
		<a routerLink="/register" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-[#dfeaf6] uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Register</a>
		<a routerLink="/test-cube" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-[#dfeaf6] uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Cube</a>
		<a routerLink="/editor" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-[#dfeaf6] uppercase no-underline transition duration-150 bg-slate-400/15 opacity-100 shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Editor</a>
	</nav>

	<div class="absolute top-1/2 right-4 z-10 flex -translate-y-1/2 flex-col gap-2 rounded-[22px] border border-slate-400/20 bg-[rgba(10,13,18,0.82)] p-2 shadow-[0_20px_50px_rgba(0,0,0,0.45)] backdrop-blur-[10px]" role="group" aria-label="Camera view">
		<button
			type="button"
			class="cursor-pointer rounded-full border px-4 py-2 text-[0.76rem] font-semibold tracking-[0.04em] uppercase transition duration-150"
			[class]="cube.camera() === 'spin' ? 'border-slate-300/40 bg-slate-400/20 text-slate-50' : 'border-transparent text-slate-300 hover:bg-slate-400/10'"
			(click)="cube.spin()"
		>Spin</button>
		@for (face of faces; track face.value) {
			<button
				type="button"
				class="cursor-pointer rounded-full border px-4 py-2 text-[0.76rem] font-semibold tracking-[0.04em] uppercase transition duration-150"
				[class]="cube.camera() === face.value ? 'border-slate-300/40 bg-slate-400/20 text-slate-50' : 'border-transparent text-slate-300 hover:bg-slate-400/10'"
				(click)="cube.showFace(face.value)"
			>{{ face.label }}</button>
		}
	</div>

	<aside class="absolute top-20 bottom-4 left-4 z-10 w-[24rem] max-w-[calc(100vw-2rem)] rounded-[22px] border border-slate-400/20 bg-[rgba(10,13,18,0.82)] p-4 shadow-[0_20px_50px_rgba(0,0,0,0.45)] backdrop-blur-[10px]">
		<app-program-area
			[running]="cube.running()"
			[problem]="cube.problem()"
			(run)="cube.run($event)"
			(stop)="cube.stop()"
			(reset)="cube.reset()"
		/>
	</aside>
</div>
