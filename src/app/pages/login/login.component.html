<app-auth-shell heading="Iniciar sesión" lead="Entra con tu nombre de usuario y contraseña.">
	@if (returnUrl) {
		<p class="mb-5 rounded-xl border border-slate-400/20 bg-slate-400/10 px-4 py-3 text-sm text-slate-200" role="status">Inicia sesión o crea una cuenta para continuar.</p>
	}

	<form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
		<label class="grid gap-2 text-sm font-bold text-slate-200">
			Correo o nombre de usuario
			<input class="min-h-12 w-full rounded-xl border border-slate-400/25 bg-(--page) px-4 text-base font-normal text-slate-50 transition duration-150 focus-visible:border-accent focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent" formControlName="username" autocomplete="username" required />
		</label>

		<label class="grid gap-2 text-sm font-bold text-slate-200">
			Contraseña
			<input class="min-h-12 w-full rounded-xl border border-slate-400/25 bg-(--page) px-4 text-base font-normal text-slate-50 transition duration-150 focus-visible:border-accent focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent" type="password" formControlName="password" autocomplete="current-password" required />
		</label>

		@if (errorMessage()) {
			<p class="rounded-xl border border-led-red/40 bg-red-500/10 px-4 py-3 text-sm text-red-200" role="alert">{{ errorMessage() }}</p>
		}

		<button class="mt-2 inline-flex min-h-12 w-full cursor-pointer items-center justify-center rounded-2xl bg-accent-pink px-5.5 py-3.5 text-base font-extrabold text-on-accent-pink transition duration-150 hover:not-disabled:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-70" type="submit" [disabled]="isSubmitting()">
			@if (isSubmitting()) {
				Entrando…
			} @else {
				Iniciar sesión
			}
		</button>
	</form>

	@if (googleEnabled) {
		<div class="my-5 flex items-center gap-3 text-sm text-slate-400" aria-hidden="true">
			<span class="h-px flex-1 bg-slate-400/25"></span>
			o
			<span class="h-px flex-1 bg-slate-400/25"></span>
		</div>

		<app-google-button [returnUrl]="returnUrl" (failed)="errorMessage.set($event)" />
	}

	<p class="mt-6 text-center text-slate-300">¿Aún no tienes cuenta? <a class="rounded font-bold text-accent no-underline hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" routerLink="/register" queryParamsHandling="preserve">Crear cuenta</a></p>
</app-auth-shell>
