<div class="block h-screen w-screen bg-(image:--cube-gradient) font-[Inter,'Segoe_UI',sans-serif] text-slate-100">
	<main class="grid h-full w-full place-items-center p-8">
		<nav class="absolute top-4 left-4 z-20 flex gap-2 rounded-full border border-slate-400/20 bg-(--surface) p-[0.4rem] shadow-[0_10px_30px_var(--shadow)] backdrop-blur-[6px]" aria-label="Navegación principal">
			<a routerLink="/login" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-(--nav-text) uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Login</a>
			<a routerLink="/register" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-(--nav-text) uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Register</a>
			<a routerLink="/test-cube" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-(--nav-text) uppercase no-underline transition duration-150 bg-slate-400/15 opacity-100 shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Cube</a>
			<a routerLink="/editor" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-(--nav-text) uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Editor</a>
			<a routerLink="/setup" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-(--nav-text) uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Setup</a>
		</nav>
		<div class="flex flex-col items-center gap-4">
			<app-cube
				class="h-[min(72vh,720px)] min-h-[420px] w-[min(72vw,820px)] overflow-hidden rounded-[22px] border-2 border-slate-400/35 bg-(--cube-frame) shadow-[0_28px_70px_var(--shadow),inset_0_0_0_1px_rgba(148,163,184,0.2),0_0_30px_rgba(96,165,250,0.08)]"
				[program]="selected().program"
				[autoplay]="true"
				aria-label="Virtual LED cube preview"
			/>
			<div class="flex flex-col items-center gap-2" role="group" aria-label="Example programs">
				<div class="flex flex-wrap justify-center gap-2">
					@for (example of examples; track example.id) {
						<button
							type="button"
							class="cursor-pointer rounded-full border px-4 py-2 text-[0.76rem] font-semibold tracking-[0.04em] uppercase transition duration-150"
							[class]="example === selected() ? 'border-slate-300/40 bg-slate-400/20 text-slate-50' : 'border-slate-400/20 text-slate-300 hover:bg-slate-400/10'"
							(click)="selected.set(example)"
						>{{ example.name }}</button>
					}
				</div>
				<p class="text-[0.76rem] text-slate-400">{{ selected().description }}</p>
			</div>
		</div>
	</main>
</div>
