<div class="block h-screen w-screen bg-[radial-gradient(circle_at_center,#171b22_0%,#0d1016_42%,#07090d_100%)] font-[Inter,'Segoe_UI',sans-serif] text-slate-100">
	<main class="grid h-full w-full place-items-center p-8">
		<nav class="absolute top-4 left-4 z-20 flex gap-2 rounded-full border border-slate-400/20 bg-[rgba(10,13,18,0.82)] p-[0.4rem] shadow-[0_10px_30px_rgba(0,0,0,0.25)] backdrop-blur-[6px]" aria-label="Navegación principal">
			<a routerLink="/login" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-[#dfeaf6] uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Login</a>
			<a routerLink="/register" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-[#dfeaf6] uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Register</a>
			<a routerLink="/test-cube" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-[#dfeaf6] uppercase no-underline transition duration-150 bg-slate-400/15 opacity-100 shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Cube</a>
			<a routerLink="/simulation" class="inline-flex items-center justify-center rounded-full px-[0.9rem] py-2 text-[0.76rem] font-semibold tracking-[0.04em] text-[#dfeaf6] uppercase no-underline transition duration-150 opacity-80 hover:bg-slate-400/15 hover:opacity-100 hover:shadow-[inset_0_0_0_1px_rgba(148,163,184,0.12)]">Simulation</a>
		</nav>
		<div class="flex flex-col items-center gap-4">
			<div #cubeHost class="relative h-[min(72vh,720px)] min-h-[420px] w-[min(72vw,820px)] overflow-hidden rounded-[22px] border-2 border-slate-400/35 bg-[rgba(17,20,27,0.75)] shadow-[0_28px_70px_rgba(0,0,0,0.55),inset_0_0_0_1px_rgba(148,163,184,0.2),0_0_30px_rgba(96,165,250,0.08)]" aria-label="Virtual LED cube preview"></div>
			<div class="flex w-full justify-center">
				<label class="relative inline-flex cursor-pointer items-center gap-3 rounded-full border border-slate-400/20 bg-slate-900/90 py-2 pr-[0.9rem] pl-[0.8rem] shadow-[0_10px_25px_rgba(15,23,42,0.25)] select-none" for="panel-toggle">
					<span class="text-[0.7rem] font-bold tracking-[0.08em] text-slate-200 uppercase">Panels</span>
					<input id="panel-toggle" class="peer sr-only" type="checkbox" [checked]="panelsEnabled" (change)="togglePanels()" />
					<span class="relative h-[1.55rem] w-[2.9rem] rounded-full bg-slate-600/80 transition duration-200 before:absolute before:top-[0.17rem] before:left-[0.2rem] before:h-[1.1rem] before:w-[1.1rem] before:rounded-full before:bg-slate-50 before:shadow-[0_2px_8px_rgba(15,23,42,0.35)] before:transition before:duration-200 before:content-[''] peer-checked:bg-[linear-gradient(135deg,#f9a8d4,#a5b4fc,#86efac)] peer-checked:before:translate-x-[1.28rem]"></span>
				</label>
			</div>
		</div>
	</main>
</div>
