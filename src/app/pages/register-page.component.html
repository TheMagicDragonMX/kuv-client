<div class="block h-screen w-screen bg-[#0b0f14] text-[#e5eef7]">
	<main class="relative grid h-full place-items-center bg-[radial-gradient(circle_at_top,rgba(96,165,250,0.12),transparent_38%),linear-gradient(180deg,#111922_0%,#090c10_100%)] p-8">
		<section class="w-full max-w-[420px] rounded-3xl border border-slate-400/20 bg-slate-900/80 px-8 py-9 shadow-[0_22px_50px_rgba(2,6,23,0.5)]" aria-labelledby="page-title">
			<p class="mb-4 text-[0.82rem] font-bold tracking-[0.24em] text-blue-300 uppercase">Kuv</p>
			<h1 id="page-title" class="mb-2 text-[clamp(2rem,4vw,2.6rem)] font-bold">Crear cuenta</h1>
			<p class="mb-[1.4rem] text-slate-300">Completa tus datos para registrarte.</p>
			<form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
				<label class="grid gap-[0.45rem] text-[0.9rem] text-[#dfeaf6]">
					Nombre de usuario
					<input class="w-full rounded-[0.85rem] border border-slate-400/20 bg-slate-900/90 px-[0.9rem] py-[0.85rem] text-slate-50 focus:outline-2 focus:outline-offset-2 focus:outline-blue-400/60" formControlName="username" autocomplete="username" minlength="3" maxlength="50" required />
				</label>
				<label class="grid gap-[0.45rem] text-[0.9rem] text-[#dfeaf6]">
					Correo electrónico
					<input class="w-full rounded-[0.85rem] border border-slate-400/20 bg-slate-900/90 px-[0.9rem] py-[0.85rem] text-slate-50 focus:outline-2 focus:outline-offset-2 focus:outline-blue-400/60" type="email" formControlName="email" autocomplete="email" required />
				</label>
				<label class="grid gap-[0.45rem] text-[0.9rem] text-[#dfeaf6]">
					Edad
					<input class="w-full rounded-[0.85rem] border border-slate-400/20 bg-slate-900/90 px-[0.9rem] py-[0.85rem] text-slate-50 focus:outline-2 focus:outline-offset-2 focus:outline-blue-400/60" type="number" formControlName="age" min="0" max="150" required />
				</label>
				<label class="grid gap-[0.45rem] text-[0.9rem] text-[#dfeaf6]">
					Contraseña
					<input class="w-full rounded-[0.85rem] border border-slate-400/20 bg-slate-900/90 px-[0.9rem] py-[0.85rem] text-slate-50 focus:outline-2 focus:outline-offset-2 focus:outline-blue-400/60" type="password" formControlName="password" autocomplete="new-password" minlength="8" required />
				</label>
				@if (errorMessage()) {
					<p class="rounded-xl bg-red-500/10 px-[0.9rem] py-3 text-[0.92rem] text-red-200" role="alert">{{ errorMessage() }}</p>
				}
				@if (successMessage()) {
					<p class="rounded-xl bg-green-500/10 px-[0.9rem] py-3 text-[0.92rem] text-green-200" role="status">{{ successMessage() }}</p>
				}
				<button class="mt-[0.4rem] cursor-pointer rounded-full bg-[linear-gradient(135deg,#60a5fa,#a78bfa)] px-[1.2rem] py-[0.9rem] text-[0.95rem] font-bold text-[#08111b] transition duration-150 hover:not-disabled:-translate-y-px hover:not-disabled:shadow-[0_12px_25px_rgba(96,165,250,0.32)] disabled:cursor-not-allowed disabled:opacity-70" type="submit" [disabled]="isSubmitting()">
					{{ isSubmitting() ? 'Registrando...' : 'Registrarme' }}
				</button>
			</form>
			<p class="mt-[1.2rem] text-slate-300">¿Ya tienes cuenta? <a class="text-blue-300 no-underline" routerLink="/login">Iniciar sesión</a></p>
		</section>
	</main>
</div>
