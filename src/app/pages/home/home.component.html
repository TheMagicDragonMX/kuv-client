<div>
	<main class="mx-auto flex max-w-340 flex-col gap-6 px-4 pt-8 pb-28 sm:px-10 sm:pt-12 md:pb-16">
		<!-- The title on the left, the button to make an animation on the right, and between them, at the height of the title and as far from both as the row allows, the mascot saying hello. -->
		<div class="flex flex-wrap items-center justify-between gap-x-8 gap-y-5">
			<h1 class="pixel-outline font-display text-[clamp(2.1rem,7vw,3.25rem)] leading-none font-bold [--outline-color:var(--login-outline)] [--outline-extra:3px_4px_0_var(--login-outline)] [--outline-size:2px]">Animaciones de la comunidad</h1>
			<app-mascot-says class="max-w-88" size="small" [mood]="mood()">
				<p class="text-[0.95rem] leading-snug font-bold text-balance">{{ greeting() }}</p>
			</app-mascot-says>
			<a appWipeLink="/editor" class="pixel-frame pixel-button inline-flex h-15 w-full cursor-pointer items-center justify-center gap-3 px-8 font-display text-[1.45rem] font-bold sm:w-auto">
				<svg viewBox="0 0 7 7" class="size-5" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true"><path d="M3 0h1v7H3z M0 3h7v1H0z" /></svg>
				Crear animación
			</a>
		</div>

		@for (section of sections; track section.id) {
			<app-animation-row [id]="section.id" [title]="section.title" [animations]="section.animations" [liked]="liked()"
				[saved]="saved()"
				[favorites]="favorites()"
				(toggled)="toggle(liked, $event)"
				(viewed)="view($event)"
				(saveToggled)="toggle(saved, $event)"
				(favoriteToggled)="toggle(favorites, $event)"
			/>
		}
	</main>
</div>
