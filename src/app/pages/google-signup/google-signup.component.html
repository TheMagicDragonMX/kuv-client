<app-auth-shell [heading]="step() === 'age' ? '¿Cuántos años tienes?' : 'Elige tu nombre'" [lead]="step() === 'age' ? 'Es lo único que Google no nos dice.' : 'Así te verán en Kü-V. Tiene que ser único.'">
	<div class="mb-5 flex flex-col gap-2" role="group" [attr.aria-label]="step() === 'age' ? 'Paso 1 de 2' : 'Paso 2 de 2'">
		<div class="flex items-center gap-2" aria-hidden="true">
			<span class="h-1.5 flex-1 rounded-full bg-accent"></span>
			<span class="h-1.5 flex-1 rounded-full transition duration-200" [class]="step() === 'username' ? 'bg-accent' : 'bg-slate-400/25'"></span>
		</div>
		<p class="text-sm text-slate-400">Paso {{ step() === 'age' ? 1 : 2 }} de 2 · {{ email }}</p>
	</div>

	<form class="grid gap-5" novalidate [formGroup]="form" (ngSubmit)="step() === 'age' ? next() : submit()">
		@if (step() === 'age') {
			<div class="grid gap-4">
				<output class="font-display text-center text-7xl leading-none font-bold text-accent" for="age" aria-live="polite">{{ form.controls.age.value }}</output>
				<input
					id="age"
					class="h-11 w-full cursor-pointer accent-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
					type="range"
					formControlName="age"
					[min]="ages.min"
					[max]="ages.max"
					step="1"
					aria-label="Tu edad en años"
				/>
				<div class="flex justify-between text-sm text-slate-400" aria-hidden="true">
					<span>{{ ages.min }}</span>
					<span>{{ ages.max }}</span>
				</div>
			</div>

			<button class="inline-flex min-h-12 w-full cursor-pointer items-center justify-center rounded-2xl bg-accent-pink px-5.5 py-3.5 text-base font-extrabold text-on-accent-pink transition duration-150 hover:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" type="submit">Siguiente</button>
			<button class="min-h-11 cursor-pointer rounded-xl text-sm font-bold text-slate-300 transition duration-150 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" type="button" (click)="cancel()">Cancelar</button>
		}

		@else {
			<label class="grid gap-2 text-sm font-bold text-slate-200">
				Nombre de usuario
				<input
					class="min-h-12 w-full rounded-xl border border-slate-400/25 bg-(--page) px-4 text-base font-normal text-slate-50 transition duration-150 focus-visible:border-accent focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-accent"
					[class.border-led-red]="status() === 'taken' || status() === 'invalid'"
					[class.border-led-green]="status() === 'available'"
					[attr.aria-invalid]="status() === 'taken' || status() === 'invalid'"
					aria-describedby="username-hint"
					formControlName="username"
					autocomplete="username"
					autocapitalize="none"
					spellcheck="false"
					minlength="3"
					maxlength="50"
					required
				/>
				<span id="username-hint" class="text-[0.8rem] font-normal" role="status" [class]="status() === 'taken' ? 'text-red-200' : status() === 'available' ? 'text-green-200' : 'text-slate-400'">{{ hint() }}</span>
			</label>

			@if (errorMessage()) {
				<p class="rounded-xl border border-led-red/40 bg-red-500/10 px-4 py-3 text-sm text-red-200" role="alert">{{ errorMessage() }}</p>
			}

			<button class="inline-flex min-h-12 w-full cursor-pointer items-center justify-center rounded-2xl bg-accent-pink px-5.5 py-3.5 text-base font-extrabold text-on-accent-pink transition duration-150 hover:not-disabled:brightness-110 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-70" type="submit" [disabled]="!canCreate() || isSubmitting()">
				@if (isSubmitting()) {
					Creando cuenta…
				} @else {
					Crear cuenta
				}
			</button>
			<button class="min-h-11 cursor-pointer rounded-xl text-sm font-bold text-slate-300 transition duration-150 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent" type="button" (click)="back()">Atrás</button>
		}
	</form>
</app-auth-shell>
