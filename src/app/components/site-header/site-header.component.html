<!-- Keeps the same height whether the header is a bar or a bubble, so the page under it never jumps. -->
<div
	class="sticky top-0 z-30 h-(--header-height) transition-[padding] duration-200 motion-reduce:transition-none"
	[class]="scrolled() ? 'pt-2 pr-18 pl-3 sm:pl-6' : 'p-0'"
>
	<header
		class="flex items-center justify-between gap-3 bg-(--surface) backdrop-blur-[10px] transition-[border-radius,box-shadow,padding,height] duration-200 motion-reduce:transition-none"
		[class]="scrolled() ? 'h-15 rounded-full border border-slate-400/25 pr-2 pl-4 shadow-[0_12px_32px_var(--shadow)] sm:pl-6' : 'h-full border-b border-slate-400/20 pr-18 pl-4 sm:pl-10'"
	>
		<div class="flex items-center gap-2 sm:gap-3">
			<a routerLink="/inicio" class="flex items-center gap-3 text-slate-100 no-underline focus-visible:outline-2 focus-visible:outline-accent" aria-label="Kü-V, inicio">
				<app-cube-logo class="size-8.5" />
				<span class="font-display text-3xl font-bold tracking-wide">Kü-V</span>
			</a>

			<!-- Only super admins see the way to their panel. -->
			@if (me()?.isSuperAdmin) {
				<a
					routerLink="/admin"
					routerLinkActive="bg-accent-pink text-on-accent-pink"
					ariaCurrentWhenActive="page"
					class="inline-flex min-h-9 items-center gap-1.5 rounded-full border border-accent-pink/50 px-3 text-[0.8rem] font-bold text-accent-pink no-underline transition duration-150 hover:bg-accent-pink/15 focus-visible:outline-2 focus-visible:outline-accent"
					title="Panel de super administrador"
				>
					<svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z" /><path d="M9 12l2 2 4-4" /></svg>
					Admin
				</a>
			}
		</div>

		<nav class="hidden gap-1.5 md:flex" aria-label="Navegación principal">
			@for (item of items; track item.path) {
				<a
					[routerLink]="item.path"
					routerLinkActive="bg-slate-400/15 text-accent"
					ariaCurrentWhenActive="page"
					class="inline-flex min-h-11 items-center rounded-full px-4 text-[0.95rem] font-bold text-slate-300 no-underline transition duration-150 hover:bg-slate-400/15 focus-visible:outline-2 focus-visible:outline-accent"
				>{{ item.label }}</a>
			}
		</nav>

		<div class="flex items-center gap-2.5 sm:gap-3">
			<!-- Botón de búsqueda de usuarios -->
			@if (signedIn()) {
				<button
					type="button"
					class="grid size-11 place-items-center rounded-full border border-slate-400/25 bg-slate-400/10 text-slate-300 transition hover:bg-slate-400/20 hover:text-slate-50 focus-visible:outline-2 focus-visible:outline-accent cursor-pointer"
					aria-label="Buscar creadores"
					title="Buscar usuarios y creadores"
					(click)="searchOpen.set(true)"
				>
					<svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<circle cx="11" cy="11" r="8" />
						<line x1="21" y1="21" x2="16.65" y2="16.65" />
					</svg>
				</button>
			}

			<a routerLink="/setup" class="inline-flex min-h-11 items-center gap-2 rounded-full border px-3 text-[0.8rem] font-bold focus-visible:outline-2 focus-visible:outline-accent sm:px-3.5" [class]="status().classes">
				<span class="size-2 rounded-full" [class]="status().dot" aria-hidden="true"></span>
				<span class="sr-only sm:not-sr-only">{{ status().label }}</span>
			</a>
			<a
				routerLink="/perfil"
				routerLinkActive="ring-2 ring-accent ring-offset-2 ring-offset-(--page)"
				ariaCurrentWhenActive="page"
				class="grid size-11 place-items-center overflow-hidden rounded-full border-2 border-white/40 bg-accent-pink text-on-accent-pink focus-visible:outline-2 focus-visible:outline-accent"
				[attr.aria-label]="signedIn() ? 'Tu perfil' : 'Iniciar sesión o crear cuenta'"
				[title]="signedIn() ? 'Tu perfil' : 'Iniciar sesión o crear cuenta'"
			>
				@if (me(); as user) {
					<app-avatar class="size-full text-lg" [name]="user.username" [photo]="user.photo" />
				} @else {
					<svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c1-4.5 4-6 8-6s7 1.5 8 6" /></svg>
				}
			</a>
		</div>
	</header>
</div>

@if (searchOpen()) {
	<app-user-search (close)="searchOpen.set(false)" />
}

<nav class="fixed inset-x-0 bottom-0 z-30 flex justify-around border-t border-slate-400/20 bg-(--surface) px-2 pt-1 pb-[max(0.25rem,env(safe-area-inset-bottom))] backdrop-blur-[10px] md:hidden" aria-label="Navegación principal">
	@for (item of items; track item.path) {
		<a
			[routerLink]="item.path"
			routerLinkActive="text-accent"
			ariaCurrentWhenActive="page"
			class="flex min-h-14 min-w-16 flex-col items-center justify-center gap-0.5 rounded-xl px-2 text-[0.72rem] font-bold text-slate-300 no-underline focus-visible:outline-2 focus-visible:outline-accent"
		>
			<svg viewBox="0 0 24 24" class="size-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
			{{ item.label }}
		</a>
	}
</nav>
